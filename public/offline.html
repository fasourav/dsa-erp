<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c0a" media="(prefers-color-scheme: dark)">
<title>Offline · DSA ERP</title>
<!--
  Served by the service worker when a page cannot load, so it cannot use the
  app stylesheet. The values below mirror the Atrium tokens in
  src/app/globals.css (--background, --foreground, --primary, glass surface).
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f3ee;
    --fg: #1d1d1f;
    --fg2: #6e6e73;
    --surface: rgba(255, 255, 255, 0.78);
    --rim: rgba(255, 255, 255, 0.85);
    --line: rgba(60, 60, 67, 0.11);
    --primary: #45632d;
    --primary-fg: #ffffff;
    --ring: rgba(69, 99, 45, 0.12);
    --aurora: radial-gradient(120% 70% at 0% 0%, rgba(140, 170, 90, 0.22), transparent 60%),
      radial-gradient(90% 60% at 100% 100%, rgba(120, 150, 200, 0.18), transparent 60%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0c0a;
      --fg: #f5f5f7;
      --fg2: #a1a1a6;
      --surface: rgba(30, 32, 28, 0.78);
      --rim: rgba(255, 255, 255, 0.1);
      --line: rgba(255, 255, 255, 0.08);
      --primary: #8fad55;
      --primary-fg: #10180c;
      --ring: rgba(143, 173, 85, 0.18);
      --aurora: radial-gradient(120% 70% at 0% 0%, rgba(110, 154, 62, 0.16), transparent 60%),
        radial-gradient(90% 60% at 100% 100%, rgba(70, 90, 140, 0.14), transparent 60%);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    background: var(--aurora), var(--bg);
    color: var(--fg);
    font: 400 15px/1.4 Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 400px;
    padding: 28px 22px 22px;
    border-radius: 32px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: inset 0 1px 0 var(--rim), 0 24px 60px -24px rgba(0, 0, 0, 0.25);
    -webkit-backdrop-filter: saturate(180%) blur(30px);
    backdrop-filter: saturate(180%) blur(30px);
  }
  .orb {
    width: 88px;
    height: 88px;
    margin: 0 auto 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 38%, #6e9a3e 0%, #45632d 45%, #1e2e13 100%);
    box-shadow: 0 0 0 10px var(--ring), 0 18px 40px -16px rgba(30, 46, 19, 0.6);
  }
  .orb img { height: 44px; }
  h1 { margin: 0; font-size: 26px; line-height: 1.1; font-weight: 700; letter-spacing: -0.025em; }
  p { margin: 8px 6px 22px; color: var(--fg2); font-size: 14.5px; }
  a {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    border-radius: 999px;
    background: var(--primary);
    color: var(--primary-fg);
    font-weight: 650;
    font-size: 16px;
    text-decoration: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }
  a:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
  small { display: block; margin-top: 16px; color: var(--fg2); font-size: 12px; }
</style>
</head>
<body>
  <main class="card">
    <div class="orb"><img src="/brand/mark-white.png" alt=""></div>
    <h1>You're offline</h1>
    <p>DSA ERP needs a connection to load your data. Check your network and try again.</p>
    <a href="">Try again</a>
    <small>DSA ERP · DynamicSpace Architects &amp; Engineers</small>
  </main>
</body>
</html>
